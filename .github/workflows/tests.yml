name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Chrome comes with the runner image; html2pptx drives it.
      - name: System tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            poppler-utils pandoc fonts-liberation

      - name: Node packages
        run: |
          npm ci --prefix docx
          npm ci --prefix pptx

      - name: Tests
        run: >
          uv run --with pytest --with openpyxl --with python-docx --with python-pptx
          --with Pillow --with pypdf --with reportlab pytest tests -q
